pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,tsx,jsx}"
      run: npx oxlint --fix {staged_files} && git add {staged_files}
    format:
      glob: "*.{js,ts,tsx,jsx,json,jsonc}"
      run: npx oxfmt --write {staged_files} && git add {staged_files}

pre-push:
  commands:
    test:
      run: pnpm turbo test --force
